onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@prisma/engines'
  - '@swc/core'
  - prisma
  - sharp
  - unrs-resolver
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  # We use Sentry's runtime SDK only, not source-map upload (no withSentryConfig),
  # so @sentry/cli's postinstall binary download is not needed.
  '@sentry/cli': false
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
overrides:
  # @vercel/blob asks for undici ^6.23.0; the server's Blob calls run on the
  # patched 6.x line (6.29.1 or later).
  'undici@6': ^6.29.1
